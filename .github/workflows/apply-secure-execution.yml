name: Apply secure execution patch

on:
  push:
    branches: [fix/secure-execution]

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/secure-execution
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Patch server route
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'server.ts';
          let source = fs.readFileSync(path, 'utf8');

          if (!source.includes('executeInSandbox')) {
            source = source.replace(
              'import { analyzeCodeOffline, generateChatOffline } from "./src/server/polyglotEngine";',
              'import { analyzeCodeOffline, generateChatOffline } from "./src/server/polyglotEngine";\nimport { executeInSandbox } from "./src/server/sandboxExecution";'
            );
          }

          const startMarker = '// 4. Code Execution / Simulation Engine';
          const endMarker = '// 5. GitHub Integration API';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker);

          if (start === -1 || end === -1 || end <= start) {
            throw new Error('Could not locate the existing /api/execute route markers. No server.ts changes made.');
          }

          const secureRoute = `// 4. Secure Code Execution Engine\napp.post("/api/execute", async (req, res) => {\n  const startTime = Date.now();\n  try {\n    const { code, language } = req.body || {};\n    if (typeof code !== "string") {\n      return res.status(400).json({\n        success: false,\n        output: "",\n        errors: "Code must be a string.",\n        duration: \"0ms\",\n        exitCode: 2,\n      });\n    }\n\n    const result = await executeInSandbox(code, language || "");\n    return res.json({\n      success: result.success,\n      output: result.output,\n      errors: result.errors,\n      duration: result.duration || \\`${'${'}Date.now() - startTime}ms\\`,\n      memory: result.memory || undefined,\n      exitCode: result.exitCode,\n      sandboxAvailable: result.sandboxAvailable,\n    });\n  } catch (err) {\n    return res.status(500).json({\n      success: false,\n      output: "",\n      errors: err instanceof Error ? err.message : String(err),\n      duration: \\`${'${'}Date.now() - startTime}ms\\`,\n      exitCode: 1,\n      sandboxAvailable: false,\n    });\n  }\n});\n\n`;

          source = source.slice(0, start) + secureRoute + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Build application
        run: npm run build

      - name: Commit verified patch and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-secure-execution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/apply-secure-execution.yml
          git commit -m "fix: route code execution through Vercel Sandbox" || echo "No changes to commit"
          git push origin fix/secure-execution
